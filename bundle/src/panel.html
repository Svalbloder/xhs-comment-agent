<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小红书评论 Agent 控制台</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e6e8ee;--mut:#8b93a7;--acc:#ff2e4d;--ok:#2fbf71;--warn:#e6a23c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI",system-ui,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:24px 20px 64px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:12px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .col{flex:1;min-width:240px}
  label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
  input,textarea,select{width:100%;background:#0d1015;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px;font:inherit}
  textarea{min-height:64px;resize:vertical}
  button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
  button.ghost{background:#232833;color:var(--fg)}
  button.small{padding:4px 10px;font-size:12px}
  button:disabled{opacity:.45;cursor:not-allowed}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#232833;color:var(--mut);font-size:12px;margin:0 6px 6px 0}
  .pill.ok{background:rgba(47,191,113,.15);color:var(--ok)}
  .pill.bad{background:rgba(255,46,77,.15);color:var(--acc)}
  .draft{border-top:1px solid var(--line);padding:12px 0}
  .draft:first-child{border-top:0}
  .meta{color:var(--mut);font-size:12px}
  .quote{color:#c8cede;background:#0d1015;border-left:2px solid var(--line);padding:6px 10px;margin:6px 0;border-radius:4px;white-space:pre-wrap}
  .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sp{flex:1}
  .toast{position:fixed;right:20px;bottom:20px;background:#232833;border:1px solid var(--line);padding:10px 14px;border-radius:8px;opacity:0;transition:.2s}
  .toast.show{opacity:1}
  .hint{color:var(--mut);font-size:12px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#0d1015;border:1px solid var(--line);border-radius:8px;padding:6px;min-height:42px}
  .tags input{flex:1;min-width:130px;border:0;background:transparent;padding:4px 2px;outline:0;width:auto}
  .tag{display:inline-flex;align-items:center;gap:6px;background:#232833;border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;max-width:100%}
  .tag span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag button{background:transparent;color:var(--mut);padding:0 5px;font-size:15px;line-height:1.1;border-radius:50%}
  .tag button:hover{color:var(--acc)}
  .remote-note{display:none;background:rgba(230,162,60,.12);color:var(--warn);border:1px solid rgba(230,162,60,.3);border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:12px}
  body.remote .remote-note{display:block}

  /* 手机竖屏 */
  @media (max-width:760px){
    .wrap{padding:14px 12px 48px}
    .col{min-width:100%}
    body{font-size:15px}
    h1{font-size:17px}
    .card{padding:12px;border-radius:10px}
    button{padding:12px 16px;font-size:15px}
    .flex > button{flex:1 1 auto}
    input,textarea,select{padding:10px 12px;font-size:15px}
    .tags{padding:8px;min-height:48px}
    .tag{font-size:13px;padding:4px 4px 4px 10px}
    .tag button{font-size:17px;padding:0 7px}
    .quote{font-size:14px}
    #runProgress,#runTokens{line-height:1.7}
    .hint{font-size:12px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="remote-note">远程模式：可以看进度、开始/暂停/终止，但「发送这条」必须在电脑上点。</div>
  <h1>小红书评论 Agent</h1>
  <div class="sub">本地控制台 · 规则改动即时生效 · 发送需要你点「发送」</div>

  <div class="card">
    <div class="flex" id="status"><span class="pill">加载中…</span></div>
  </div>

  <div class="card">
    <div class="flex" style="justify-content:space-between">
      <strong>主控面板</strong>
      <span class="pill" id="runState">空闲</span>
    </div>
    <div class="hint" id="runNowText" style="margin-top:6px">还没跑过</div>
    <div class="hint" id="runProgress" style="margin-top:2px"></div>
    <div class="hint" id="runTokens" style="margin-top:2px"></div>
    <div class="flex" style="margin-top:12px">
      <button id="btnStart" onclick="runNow('loop')">开始（持续跑）</button>
      <button id="btnOnce" class="ghost" onclick="runNow('once')">跑一轮</button>
      <button id="btnPause" class="ghost" onclick="ctrl('pause')">暂停</button>
      <button id="btnResume" class="ghost" onclick="ctrl('resume')">继续</button>
      <button id="btnStop" class="ghost" onclick="ctrl('stop')">终止</button>
    </div>
    <div style="margin-top:14px;padding-top:12px;border-top:1px solid #262b36">
      <label style="display:block;color:var(--fg);margin-bottom:2px">发送管控</label>
      <label class="flex" style="margin-top:8px">
        <input id="requireApproval" type="checkbox" style="width:auto" onchange="saveRules()"> <span style="color:var(--fg)">人工复核：每条回复都要在清单里确认后才发送</span>
      </label>
      <label class="flex" style="margin-top:8px">
        <input id="dryRun" type="checkbox" style="width:auto" onchange="saveRules()"> <span style="color:var(--fg)">演练模式：只生成草稿，不向平台发送</span>
      </label>
      <div class="hint" style="margin-top:8px">演练模式优先级最高：开启时任何发送动作（含人工复核）都会被拦截。</div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div class="col">
        <label>搜索语句 / 关键词（回车添加一个；最多生效前 3 个）</label>
        <div class="tags" id="tags-keywords"></div>
        <label>评论必须包含任一（空 = 不筛）</label>
        <div class="tags" id="tags-must_any"></div>
        <label>评论必须不含（黑名单）</label>
        <div class="tags" id="tags-must_not"></div>
        <label>回复里禁用词（命中直接拒绝发送）</label>
        <div class="tags" id="tags-banned_words"></div>
      </div>
      <div class="col">
        <label>评论最大字数</label>
        <input id="max_len" type="number" min="1" max="1000">
        <label>单篇笔记最多回几条</label>
        <input id="max_per_note" type="number" min="1" max="20">
        <div class="row">
          <div class="col"><label>每小时上限</label><input id="hourly_quota" type="number" min="1" max="60"></div>
          <div class="col"><label>每天上限</label><input id="daily_quota" type="number" min="1" max="200"></div>
        </div>
        <div class="row">
          <div class="col"><label>最小间隔（秒）</label><input id="min_interval_sec" type="number" min="5" max="600"></div>
          <div class="col"><label>回复最大字数</label><input id="max_chars" type="number" min="10" max="300"></div>
        </div>
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid #262b36">
          <label style="display:block;color:var(--fg);margin-bottom:2px">运行节奏</label>
          <label class="flex" style="margin-top:8px">
            <span style="color:var(--fg)">每轮间隔（秒）</span>
            <input id="cycle_interval_sec" type="number" min="10" max="3600" style="width:120px">
          </label>
          <label class="flex" style="margin-top:8px">
            <span style="color:var(--fg)">每轮最多处理笔记数</span>
            <input id="max_notes_per_cycle" type="number" min="1" max="50" style="width:120px">
          </label>
          <div class="hint" style="margin-top:8px">「开始」会按这个节奏一轮接一轮跑，直到你点「终止」。</div>
        </div>
      </div>
    </div>
    <div class="flex" style="margin-top:14px">
      <button onclick="saveRules()">保存规则</button>
      <button class="ghost" onclick="load()">重新载入</button>
      <div class="sp"></div>
      <span class="hint" id="rulesPath"></span>
    </div>
  </div>

  <div class="card">
    <div class="flex">
      <strong>待审草稿</strong>
      <span class="hint" id="draftCount"></span>
      <div class="sp"></div>
      <button class="ghost small" onclick="load()">刷新</button>
    </div>
    <div id="drafts"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let S = null
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(function(){t.classList.remove('show')},1800) }

/* ---------- 标签式输入：回车/点「添加」生成一个标签，点 × 删除 ---------- */
const TAG_PH = {
  keywords: '输入关键词后回车，例如：上海 露营 免费营地',
  must_any: '输入必含词后回车，例如：多少钱',
  must_not: '输入黑名单词后回车，例如：加微',
  banned_words: '输入禁用词后回车，例如：微信'
}
const TAGS = { keywords: [], must_any: [], must_not: [], banned_words: [] }

function renderTags(name){
  const box = $('tags-' + name)
  if(!box) return
  const focused = box.contains(document.activeElement)
  box.innerHTML = ''
  TAGS[name].forEach(function(v, i){
    const tag = document.createElement('span'); tag.className = 'tag'
    const txt = document.createElement('span'); txt.textContent = v
    const del = document.createElement('button'); del.type = 'button'; del.textContent = '×'; del.title = '删除'
    del.onclick = function(){ TAGS[name].splice(i, 1); renderTags(name); focusTagInput(name) }
    tag.appendChild(txt); tag.appendChild(del); box.appendChild(tag)
  })
  const inp = document.createElement('input')
  inp.placeholder = TAGS[name].length ? '继续添加…' : TAG_PH[name]
  inp.onkeydown = function(e){
    if(e.key === 'Enter'){ e.preventDefault(); addTag(name, inp.value) }
    else if(e.key === 'Backspace' && !inp.value && TAGS[name].length){ TAGS[name].pop(); renderTags(name); focusTagInput(name) }
  }
  box.appendChild(inp)
  if(focused) inp.focus()
}

function addTag(name, raw){
  const v = String(raw || '').trim()
  if(!v) return
  if(TAGS[name].indexOf(v) === -1) TAGS[name].push(v)
  renderTags(name)
  focusTagInput(name)
}

function focusTagInput(name){
  const box = $('tags-' + name); if(!box) return
  const inp = box.querySelector('input'); if(inp){ inp.value = ''; inp.focus() }
}

function tagsBeingEdited(){
  const a = document.activeElement
  return !!(a && a.closest && a.closest('.tags'))
}

function syncTags(name, arr){
  const next = (arr || []).slice()
  if(next.join('\u0000') === TAGS[name].join('\u0000')) return   // 没变就别重建，避免打断输入
  TAGS[name] = next
  renderTags(name)
}

// 初始渲染：值为空时 syncTags 会跳过，必须先把输入框建出来
Object.keys(TAGS).forEach(renderTags)

function renderStatus(st){
  const logged = st.login && st.login.is_logged_in
  $('status').innerHTML =
    '<span class="pill '+(st.healthy?'ok':'bad')+'">服务 '+(st.healthy?'在线':'离线')+'</span>' +
    '<span class="pill '+(logged?'ok':'bad')+'">'+(logged?('已登录 · '+esc(st.login.username||'')):'未登录')+'</span>' +
    '<span class="pill">今日 '+st.quota.dayCount+'/'+st.quota.daily_quota+'</span>' +
    '<span class="pill">本小时 '+st.quota.hourCount+'/'+st.quota.hourly_quota+'</span>' +
    '<span class="pill">已发送 '+st.sentTotal+'</span>' +
    (st.hardStopped?'<span class="pill bad">已熔断</span>':'')
  renderControl(st)
}

async function load(){
  const r = await fetch('/api/state'); S = await r.json()
  const st = S.status
  if(S.local === false) document.body.classList.add('remote')
  else document.body.classList.remove('remote')
  renderStatus(st)
  const r0 = S.rules || {}
  const cg = r0.comment_gate || {}
  const rp = r0.reply_policy || {}
  const rs = r0.reply_style || {}
  if(tagsBeingEdited()){
    // 正在输入标签时不要被 15s 轮询覆盖
  } else {
    syncTags('keywords', r0.keywords)
    syncTags('must_any', cg.must_any)
    syncTags('must_not', cg.must_not)
    syncTags('banned_words', rs.banned_words)
  }
  $('max_len').value = cg.max_len != null ? cg.max_len : 120
  $('max_per_note').value = rp.max_per_note != null ? rp.max_per_note : 2
  $('hourly_quota').value = rp.hourly_quota != null ? rp.hourly_quota : 5
  $('daily_quota').value = rp.daily_quota != null ? rp.daily_quota : 20
  $('min_interval_sec').value = rp.min_interval_sec != null ? rp.min_interval_sec : 45
  $('max_chars').value = rs.max_chars != null ? rs.max_chars : 60
  $('dryRun').checked = !!st.dryRun
  $('requireApproval').checked = st.requireApproval !== false
  $('cycle_interval_sec').value = rp.cycle_interval_sec != null ? rp.cycle_interval_sec : 60
  $('max_notes_per_cycle').value = rp.max_notes_per_cycle != null ? rp.max_notes_per_cycle : 6
  $('rulesPath').textContent = S.rulesPath || ''
  renderDrafts(S.drafts || [])
}

async function saveRules(){
  const body = {
    keywords: TAGS.keywords.slice(),
    comment_gate: { level:[1,2], must_any: TAGS.must_any.slice(), must_not: TAGS.must_not.slice(), max_len: +$('max_len').value || 120 },
    reply_policy: { max_per_note:+$('max_per_note').value||2, hourly_quota:+$('hourly_quota').value||5, daily_quota:+$('daily_quota').value||20, min_interval_sec:+$('min_interval_sec').value||45, cycle_interval_sec:+$('cycle_interval_sec').value||60, max_notes_per_cycle:+$('max_notes_per_cycle').value||6 },
    reply_style: { max_chars:+$('max_chars').value||60, banned_words: TAGS.banned_words.slice() },
    dry_run: $('dryRun').checked,
    require_approval: $('requireApproval').checked
  }
  const r = await fetch('/api/rules', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)})
  const j = await r.json()
  toast(j.ok ? '已保存，下一轮采集立即生效' : ('保存失败：'+(j.error||'')))
  load()
}

function renderDrafts(list){
  $('draftCount').textContent = list.length ? ('共 '+list.length+' 条') : ''
  if(!list.length){
    $('drafts').innerHTML = '<div class="hint" style="padding:12px 0">还没有草稿。在对话里说「搜露营，把候选做成草稿」，抓完评论就会出现在这里。</div>'
    return
  }
  let html = ''
  for(let i=0;i<list.length;i++){
    const d = list[i]
    html += '<div class="draft" data-i="'+i+'">' +
      '<div class="meta"><span class="pill">'+(d.level===2?'二级回复':'一级评论')+'</span>' +
      (d.sent?'<span class="pill bad">已发送</span>':'') +
      esc(d.user||'')+' · 赞 '+(d.liked||0)+' · '+esc(String(d.createdAt||'').slice(0,19))+'</div>' +
      '<div class="quote">'+esc(d.content||'')+'</div>' +
      '<textarea id="t'+i+'" style="min-height:52px">'+esc(d.replyText||'')+'</textarea>' +
      '<div class="flex" style="margin-top:8px">' +
        (S.local === false
          ? '<span class="hint">发送需在电脑上确认</span>'
          : '<button class="small" onclick="send('+i+')"'+(d.sent?' disabled':'')+'>发送这条</button>') +
        '<button class="ghost small" onclick="skip('+i+')">跳过</button>' +
        '<span class="hint" id="m'+i+'"></span>' +
      '</div></div>'
  }
  $('drafts').innerHTML = html
}

async function send(i){
  const d = S.drafts[i]
  const text = $('t'+i).value.trim()
  if(!text){ toast('文案不能为空'); return }
  if(!confirm('确认发送到这条评论？\n\n'+String(d.content).slice(0,60)+'\n\n回复：'+text)) return
  $('m'+i).textContent = '发送中…'
  const r = await fetch('/api/reply', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({commentId:d.commentId, feedId:d.feedId, xsecToken:d.xsecToken, text:text})})
  const j = await r.json()
  $('m'+i).textContent = j.ok ? '已发送' : ('失败：'+(j.blocked||j.error||j.reason||''))
  if(j.ok) setTimeout(load, 800)
}

async function skip(i){
  const d = S.drafts[i]
  await fetch('/api/skip', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({commentId:d.commentId})})
  load()
}

/* ---------- 主控面板 ---------- */
const ACTION_DESC = {
  searching: (c) => '正在搜索「' + (c.keyword || '…') + '」',
  comments: (c) => '抓评论：' + (c.noteTitle || ''),
  generating: (c) => '生成回复：@' + (c.commentUser || '') + ' 「' + (c.commentText || '') + '」',
  drafted: (c) => '草稿已生成：' + (c.replyText || ''),
  waiting: (c) => '等下一轮（约 ' + (c.seconds || 0) + ' 秒）'
}

function fmtNum(n){ return Number(n || 0).toLocaleString('zh-CN') }

function renderControl(st){
  const job = st.job || null
  const running = !!st.running
  const paused = !!st.paused
  let label = '空闲', cls = ''
  if (job) {
    const s = job.status
    if (s === 'running') { label = '运行中'; cls = 'ok' }
    else if (s === 'paused') label = '已暂停'
    else if (s === 'stopping') label = '正在终止…'
    else if (s === 'stopped') label = '已停止'
    else if (s === 'done') label = '已完成'
    else if (s === 'error') { label = '出错'; cls = 'bad' }
  }
  if (paused) label = '已暂停'
  if ($('runState')) { $('runState').textContent = label; $('runState').className = 'pill ' + cls }

  let what = '还没跑过'
  const cur = job && job.current
  if (cur && ACTION_DESC[cur.action]) what = ACTION_DESC[cur.action](cur)
  else if (job && job.status === 'done') what = '这一轮已结束'
  else if (job && job.status === 'stopped') what = '已终止'
  if ($('runNowText')) $('runNowText').textContent = what

  if ($('runProgress')) {
    $('runProgress').textContent = (job && job.status)
      ? '第 ' + (job.cycles || 0) + ' 轮 · 笔记 ' + (job.notesDone || 0) + '/' + (job.notesTotal || 0) +
        ' · 候选 ' + (job.candidates || 0) + ' · 草稿 ' + (job.drafted || 0) + ' · 已发 ' + (job.sent || 0) +
        ((job.errors && job.errors.length) ? (' · 错误 ' + job.errors.length) : '')
      : ''
  }

  const t = (job && job.tokens) || { input: 0, output: 0, total: 0, calls: 0 }
  const u = st.usage || { input: 0, output: 0, total: 0, calls: 0 }
  if ($('runTokens')) {
    $('runTokens').textContent = '本轮 token ' + fmtNum(t.total) + '（入 ' + fmtNum(t.input) + ' / 出 ' + fmtNum(t.output) +
      ' · ' + (t.calls || 0) + ' 次调用） ｜ 累计 ' + fmtNum(u.total)
  }

  if ($('btnStart')) $('btnStart').disabled = running
  if ($('btnOnce')) $('btnOnce').disabled = running
  if ($('btnPause')) $('btnPause').disabled = !running || paused
  if ($('btnResume')) $('btnResume').disabled = !paused
  if ($('btnStop')) $('btnStop').disabled = !running
}

async function runNow(mode){
  if (mode === 'loop' && !confirm('「开始」会一轮接一轮持续跑，直到你点「终止」。确认开始？')) return
  const r = await fetch('/api/run', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({mode: mode})})
  const j = await r.json()
  if(!j.ok) toast(j.busy ? '还在跑，先暂停或终止' : ('启动失败：'+(j.error||'')))
  else toast(mode === 'loop' ? '已开始持续运行' : '已开始跑一轮')
  poll()
}

async function ctrl(action){
  const r = await fetch('/api/control', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({action: action})})
  const j = await r.json()
  if(!j.ok) toast(j.error || '操作失败')
  else toast(action==='pause' ? '已暂停' : action==='resume' ? '已继续' : '正在终止…')
  poll()
}

async function poll(){
  try{
    const r = await fetch('/api/state')
    const s = await r.json()
    if(!s || !s.status) return
    S = s
    renderStatus(s.status)
  }catch(e){ /* 面板重启中，忽略这一拍 */ }
}

load(); setInterval(load, 15000); setInterval(poll, 2500)
</script>
</body></html>
